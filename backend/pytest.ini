[pytest]
testpaths = tests
# Every test here is async (the app, the ORM and the HTTP client all are), so
# opt in globally rather than decorating each one.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    no_seeded_user: start with an empty users table (for the account tests themselves)
filterwarnings =
    # The app itself calls datetime.utcnow() in a dozen places; deprecating it
    # is a separate change from testing it.
    ignore::DeprecationWarning
