<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Warm the connections the hover preview needs, so the first embed load
         doesn't pay DNS + TLS + TCP setup from cold. -->
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="preconnect" href="https://www.google.com" />
    <link rel="preconnect" href="https://googlevideo.com" />
    <link rel="dns-prefetch" href="https://googlevideo.com" />
    <title>My Feed</title>
    <!-- The Theme setting as last seen (lib/theme.ts keeps the copy), applied
         before the first paint so a light page doesn't flash dark on load. -->
    <script>
      try {
        var theme = localStorage.getItem('ytfeed:theme')
        if (theme === 'system') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        if (theme === 'light') document.documentElement.dataset.theme = 'light'
      } catch (e) {}
    </script>
  </head>
  <body class="bg-shade-0f text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
